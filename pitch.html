# 🏗️ IT Internship Training Program — Executive Pitch

> **Objective**: To build a zero-cost, enterprise-grade Minimum Viable Lab (MVL) that trains interns on highly relevant corporate IT skills including Identity Management (Active Directory/Okta), Zero Trust Networking (Cloudflare), and Infrastructure Monitoring.

---

## 1. Core Technologies

| Category | Tools |
|---|---|
| Virtualization | VirtualBox |
| Networking | pfSense Firewall (Routing, NAT, DHCP) |
| Identity & Access | Windows Server 2022 (AD DS) + Okta SSO |
| Linux Services | Ubuntu 22.04 (Apache, MariaDB) |
| ITSM & Knowledge Base | GLPI + BookStack |
| Monitoring | Zabbix & Grafana |
| Security & Logging | Wazuh SIEM, OpenVAS |
| Cloud/External | Cloudflare Tunnels, Azure, M365, ServiceNow |

## 4. Sprint Roadmap (8 Sprints, ~30 hrs total)

| Sprint | Focus | Duration | Key Deliverables |
|---|---|---|---|
| 1 | Foundation | 4-5 hrs | VirtualBox, pfSense, Windows Server + AD DS |
| 2 | Linux Services | 3-4 hrs | Ubuntu, GLPI (ticketing), BookStack (wiki) |
| 3 | Monitoring | 3-4 hrs | Zabbix, Grafana dashboards |
| 4 | Security & SIEM | 4-5 hrs | Wazuh, OpenVAS, DVWA |
| 5 | Networking | 2-3 hrs | Nmap, Wireshark, pfSense rules |
| 6 | Remote Mgmt | 3-4 hrs | MeshCentral, OCS Inventory, Veeam backup |
| 7 | Cloud & SSO | 5-6 hrs | M365, Okta SSO, Cloudflare Tunnels |
| 8 | Final Docs | 3-4 hrs | Architecture diagrams, runbooks |

---

## 5. Why This Approach?

1. **Zero Hardware Cost**: Everything runs locally on existing hardware using free/open-source tools.
2. **Real-World Skills**: Interns learn how 33+ enterprise tools interconnect via LDAP, Syslog, SNMP, SAML, and OIDC.
3. **Modern Identity**: Okta SSO integration teaches cloud-native identity management.
4. **Zero Trust Networking**: Cloudflare Tunnels expose internal services securely without port forwarding.
5. **Fully Documented**: Sprint-based workflow with reactive Kanban tracking and automated checklists.
6. **Scalable**: The PoC can be migrated to Proxmox bare-metal for production-grade multi-user training.
