<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Think Polaris IT Internship Training Program — Kanban Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   CSS CUSTOM PROPERTIES
   ═══════════════════════════════════════════════════════════ */
:root {
  --sprint-0: #22c55e; --sprint-1: #4f7cff; --sprint-2: #8b5cf6;
  --sprint-3: #f97316; --sprint-4: #ef4444; --sprint-5: #eab308;
  --sprint-6: #a855f7; --sprint-7: #06b6d4; --sprint-8: #10b981;

  --col-backlog: #4f7cff; --col-active: #8b5cf6;
  --col-docs: #f97316;   --col-complete: #22c55e;

  --bg-primary: #0d0f18; --bg-secondary: #141625;
  --bg-card: rgba(20, 22, 40, 0.65); --bg-glass: rgba(255,255,255,0.04);
  --bg-glass-hover: rgba(255,255,255,0.08);
  --border-glass: rgba(255,255,255,0.08);
  --border-glass-hover: rgba(255,255,255,0.15);
  --text-primary: #e8eaf0; --text-secondary: #8b8fa3;
  --text-dim: #555972;
  --shadow-card: 0 4px 24px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.2);
  --shadow-card-hover: 0 8px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
  --radius: 14px; --radius-sm: 10px; --radius-xs: 6px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', 'Consolas', monospace;
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  font-family: var(--font); background: var(--bg-primary);
  color: var(--text-primary); min-height: 100vh;
  overflow-x: auto; -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 800px 600px at 20% 10%, rgba(79,124,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 600px 500px at 80% 80%, rgba(139,92,246,0.05) 0%, transparent 70%);
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,15,24,0.82); backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border-bottom: 1px solid var(--border-glass);
  padding: 16px 32px;
}
.header-inner {
  max-width: 1800px; margin: 0 auto;
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
}
.header-brand {
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
.header-logo {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--col-backlog), var(--col-active));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #fff;
  box-shadow: 0 2px 12px rgba(79,124,255,0.3);
}
.header-title {
  font-size: 1.2rem; font-weight: 700;
  background: linear-gradient(135deg, #e8eaf0 30%, #8b8fa3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-subtitle {
  font-size: 0.7rem; color: var(--text-dim);
  font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
  margin-top: 2px;
}

/* Overall Progress */
.overall-progress-wrap {
  flex: 1; min-width: 250px; max-width: 500px;
}
.overall-progress-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.72rem; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px;
}
.overall-progress-label span:last-child {
  font-family: var(--mono); color: var(--text-primary); font-size: 0.8rem;
}
.overall-progress-bar {
  height: 8px; background: rgba(255,255,255,0.06);
  border-radius: 99px; overflow: hidden; position: relative;
}
.overall-progress-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--col-backlog), var(--col-active), var(--col-complete));
  background-size: 200% 100%;
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
}
.overall-progress-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
  animation: shimmer 2.5s infinite;
}
@keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

/* Header actions */
.header-actions { display: flex; gap: 10px; margin-left: auto; }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-family: var(--font); font-size: 0.78rem; font-weight: 600;
  border: 1px solid var(--border-glass); cursor: pointer;
  transition: var(--transition); text-transform: uppercase; letter-spacing: 0.5px;
}
.btn-ghost {
  background: var(--bg-glass); color: var(--text-secondary);
}
.btn-ghost:hover {
  background: var(--bg-glass-hover); color: var(--text-primary);
  border-color: var(--border-glass-hover);
}
.btn-danger {
  background: rgba(239,68,68,0.1); color: #ef4444;
  border-color: rgba(239,68,68,0.2);
}
.btn-danger:hover {
  background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.35);
}

/* ═══════════════════════════════════════════════════════════
   STATS BAR
   ═══════════════════════════════════════════════════════════ */
.stats-bar {
  max-width: 1800px; margin: 0 auto;
  display: flex; gap: 12px; padding: 20px 32px 0; flex-wrap: wrap;
}
.stat-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  background: var(--bg-glass); border: 1px solid var(--border-glass);
  font-size: 0.75rem; font-weight: 600; color: var(--text-secondary);
  backdrop-filter: blur(12px); transition: var(--transition);
}
.stat-chip:hover { background: var(--bg-glass-hover); }
.stat-dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.stat-value { color: var(--text-primary); font-family: var(--mono); }

/* ═══════════════════════════════════════════════════════════
   BOARD LAYOUT
   ═══════════════════════════════════════════════════════════ */
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(300px, 1fr));
  gap: 20px; padding: 20px 32px 40px;
  max-width: 1800px; margin: 0 auto;
}

/* ═══════════════════════════════════════════════════════════
   COLUMNS
   ═══════════════════════════════════════════════════════════ */
.column {
  background: rgba(20,22,37,0.45);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius); min-height: 400px;
  display: flex; flex-direction: column; transition: var(--transition);
}
.column.drag-over {
  border-color: rgba(255,255,255,0.2);
  background: rgba(30,33,55,0.6);
  box-shadow: inset 0 0 40px rgba(255,255,255,0.02);
}
.column-header {
  padding: 18px 20px 14px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border-glass);
  position: relative; overflow: hidden;
}
.column-header::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  border-radius: 0 0 4px 4px;
}
.column[data-col="backlog"] .column-header::before { background: linear-gradient(90deg, var(--col-backlog), transparent); }
.column[data-col="active"] .column-header::before  { background: linear-gradient(90deg, var(--col-active), transparent); }
.column[data-col="docs"] .column-header::before    { background: linear-gradient(90deg, var(--col-docs), transparent); }
.column[data-col="complete"] .column-header::before { background: linear-gradient(90deg, var(--col-complete), transparent); }

.column-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.column[data-col="backlog"] .column-icon  { background: rgba(79,124,255,0.12); }
.column[data-col="active"] .column-icon   { background: rgba(139,92,246,0.12); }
.column[data-col="docs"] .column-icon     { background: rgba(249,115,22,0.12); }
.column[data-col="complete"] .column-icon { background: rgba(34,197,94,0.12); }

.column-title {
  font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.2px;
}
.column[data-col="backlog"] .column-title  { color: var(--col-backlog); }
.column[data-col="active"] .column-title   { color: var(--col-active); }
.column[data-col="docs"] .column-title     { color: var(--col-docs); }
.column[data-col="complete"] .column-title { color: var(--col-complete); }

.column-count {
  margin-left: auto; padding: 2px 10px; border-radius: 99px;
  font-size: 0.7rem; font-weight: 700; font-family: var(--mono);
}
.column[data-col="backlog"] .column-count  { background: rgba(79,124,255,0.12); color: var(--col-backlog); }
.column[data-col="active"] .column-count   { background: rgba(139,92,246,0.12); color: var(--col-active); }
.column[data-col="docs"] .column-count     { background: rgba(249,115,22,0.12); color: var(--col-docs); }
.column[data-col="complete"] .column-count { background: rgba(34,197,94,0.12); color: var(--col-complete); }

.column-body {
  flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto; max-height: calc(100vh - 280px);
}
.column-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 0.78rem; font-weight: 500;
  border: 2px dashed rgba(255,255,255,0.05); border-radius: var(--radius-sm);
  margin: 4px; min-height: 80px; text-align: center; padding: 20px;
}

/* ═══════════════════════════════════════════════════════════
   CARDS
   ═══════════════════════════════════════════════════════════ */
.card {
  background: var(--bg-card);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-sm); padding: 16px;
  cursor: grab; transition: var(--transition);
  position: relative; overflow: hidden;
  animation: cardIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.card:hover {
  border-color: var(--border-glass-hover);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 3px;
  height: 100%; border-radius: 3px 0 0 3px;
}
.card.dragging {
  opacity: 0.4; transform: rotate(2deg) scale(0.97);
  box-shadow: none;
}

/* Card color accents via inline style --card-color */
.card { --cc: var(--card-color, var(--col-backlog)); }
.card::before { background: var(--cc); }

.card-header {
  display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px;
}
.card-sprint-badge {
  padding: 3px 10px; border-radius: 99px;
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; white-space: nowrap; flex-shrink: 0;
  background: color-mix(in srgb, var(--cc) 15%, transparent);
  color: var(--cc); border: 1px solid color-mix(in srgb, var(--cc) 25%, transparent);
}
.card-title {
  font-size: 0.88rem; font-weight: 650; color: var(--text-primary);
  line-height: 1.35; flex: 1;
}
.card-desc {
  font-size: 0.74rem; color: var(--text-secondary); line-height: 1.55;
  margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.card-tags {
  display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px;
}
.card-tag {
  padding: 2px 8px; border-radius: 4px; font-size: 0.62rem; font-weight: 600;
  background: rgba(255,255,255,0.04); color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.04); letter-spacing: 0.3px;
}
.card-progress { margin-bottom: 8px; }
.card-progress-info {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 5px;
}
.card-progress-text {
  font-size: 0.68rem; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.card-progress-pct {
  font-size: 0.72rem; font-weight: 700; font-family: var(--mono);
  color: var(--cc);
}
.card-progress-bar {
  height: 4px; background: rgba(255,255,255,0.06);
  border-radius: 99px; overflow: hidden;
}
.card-progress-fill {
  height: 100%; border-radius: 99px; background: var(--cc);
  transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.04);
}
.card-est {
  font-size: 0.66rem; font-weight: 500; color: var(--text-dim);
  display: flex; align-items: center; gap: 4px;
}
.card-open-btn {
  padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border-glass);
  background: var(--bg-glass); color: var(--text-secondary);
  font-family: var(--font); font-size: 0.68rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
}
.card-open-btn:hover {
  background: color-mix(in srgb, var(--cc) 15%, transparent);
  color: var(--cc); border-color: color-mix(in srgb, var(--cc) 30%, transparent);
}

/* ═══════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 24px; animation: fadeIn 0.2s ease;
}
.modal-overlay.active { display: flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border-glass-hover);
  border-radius: 18px; width: 100%; max-width: 680px;
  max-height: 85vh; display: flex; flex-direction: column;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  animation: modalIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  overflow: hidden;
}
@keyframes modalIn {
  from { opacity:0; transform:translateY(20px) scale(0.96); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
.modal-top {
  padding: 24px 28px 0; position: relative;
}
.modal-top-accent {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.modal-sprint-badge {
  display: inline-block; padding: 4px 14px; border-radius: 99px;
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 10px;
}
.modal-title {
  font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;
  color: var(--text-primary);
}
.modal-desc {
  font-size: 0.82rem; color: var(--text-secondary); line-height: 1.6;
  margin-bottom: 16px;
}
.modal-progress-wrap { margin-bottom: 16px; }
.modal-progress-info {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.modal-progress-text {
  font-size: 0.72rem; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.8px;
}
.modal-progress-pct {
  font-size: 0.85rem; font-weight: 700; font-family: var(--mono);
}
.modal-progress-bar {
  height: 6px; background: rgba(255,255,255,0.06);
  border-radius: 99px; overflow: hidden;
}
.modal-progress-fill {
  height: 100%; border-radius: 99px;
  transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Modal tabs */
.modal-tabs {
  display: flex; border-bottom: 1px solid var(--border-glass);
  padding: 0 28px; gap: 0;
}
.modal-tab {
  padding: 12px 20px; font-size: 0.78rem; font-weight: 600;
  color: var(--text-dim); cursor: pointer; border: none; background: none;
  font-family: var(--font); position: relative; transition: var(--transition);
  text-transform: uppercase; letter-spacing: 0.8px;
}
.modal-tab:hover { color: var(--text-secondary); }
.modal-tab.active { color: var(--text-primary); }
.modal-tab.active::after {
  content: ''; position: absolute; bottom: -1px; left: 20px; right: 20px;
  height: 2px; border-radius: 99px;
}

.modal-body {
  flex: 1; overflow-y: auto; padding: 20px 28px 28px;
}
.modal-panel { display: none; }
.modal-panel.active { display: block; }

/* Checklist */
.checklist-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 12px; border-radius: var(--radius-xs);
  transition: var(--transition); cursor: pointer;
  border: 1px solid transparent;
}
.checklist-item:hover {
  background: var(--bg-glass); border-color: var(--border-glass);
}
.checklist-cb-wrap {
  position: relative; width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px;
}
.checklist-cb {
  position: absolute; opacity: 0; width: 100%; height: 100%;
  cursor: pointer; z-index: 2;
}
.checklist-cb-visual {
  width: 20px; height: 20px; border-radius: 5px;
  border: 2px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); font-size: 11px; color: transparent;
}
.checklist-cb:checked + .checklist-cb-visual {
  border-color: var(--cc); background: color-mix(in srgb, var(--cc) 20%, transparent);
  color: var(--cc);
}
.checklist-label {
  font-size: 0.82rem; color: var(--text-primary); line-height: 1.5;
  transition: var(--transition); flex: 1;
}
.checklist-item.done .checklist-label {
  color: var(--text-dim); text-decoration: line-through;
}

/* Guide tab */
.guide-content {
  font-family: var(--mono); font-size: 0.78rem;
  color: var(--text-secondary); line-height: 1.8;
  white-space: pre-wrap; background: rgba(0,0,0,0.25);
  border: 1px solid var(--border-glass); border-radius: var(--radius-sm);
  padding: 20px; max-height: 55vh; overflow-y: auto;
}

/* Modal close */
.modal-close {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border-glass); background: var(--bg-glass);
  color: var(--text-dim); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); font-family: var(--font);
}
.modal-close:hover {
  background: rgba(239,68,68,0.15); color: #ef4444;
  border-color: rgba(239,68,68,0.3);
}

/* ═══════════════════════════════════════════════════════════
   ACTIVITY LOG PANEL
   ═══════════════════════════════════════════════════════════ */
.activity-toggle {
  position: fixed; bottom: 24px; right: 24px; z-index: 200;
  width: 48px; height: 48px; border-radius: 14px;
  background: linear-gradient(135deg, var(--col-backlog), var(--col-active));
  border: none; color: #fff; font-size: 18px; cursor: pointer;
  box-shadow: 0 4px 20px rgba(79,124,255,0.35);
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.activity-toggle:hover { transform: scale(1.08); }
.activity-badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 18px; height: 18px; border-radius: 99px;
  background: #ef4444; font-size: 0.6rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px; border: 2px solid var(--bg-primary);
}
.activity-panel {
  position: fixed; bottom: 84px; right: 24px; z-index: 200;
  width: 380px; max-height: 460px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-glass-hover);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 16px 48px rgba(0,0,0,0.45);
  display: none; flex-direction: column;
  animation: slideUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
.activity-panel.active { display: flex; }
@keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.activity-panel-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border-glass);
  display: flex; align-items: center; justify-content: space-between;
}
.activity-panel-title {
  font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-primary);
}
.activity-clear-btn {
  padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border-glass);
  background: var(--bg-glass); color: var(--text-dim);
  font-family: var(--font); font-size: 0.66rem; font-weight: 600;

const STORAGE_KEY = "mvl-kanban-state-v3";
const COLUMN_NAMES = {backlog:"Backlog", active:"Active Sprint", docs:"Documentation", complete:"Complete"};
const COLUMN_IDS = ["backlog","active","docs","complete"];

/* ── STATE ── */
let sprints = [];
let activityLog = [];
let currentModalId = null;
let unreadActivity = 0;

/* ── INIT ── */
function init() {
  loadState();
  renderBoard();
  updateOverallProgress();
  renderStats();
  renderActivityLog();
  setupDragDrop();
  setupModal();
  setupActivityPanel();
}

/* ── PERSISTENCE ── */
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      sprints = parsed.sprints || deepClone(DEFAULT_SPRINTS);
      activityLog = parsed.activityLog || [];
      // Merge guide text from defaults (not stored)
      sprints.forEach(s => {
        const def = DEFAULT_SPRINTS.find(d => d.id === s.id);
        if (def) s.guide = def.guide;
      });
    } else {
      sprints = deepClone(DEFAULT_SPRINTS);
      activityLog = [{text:"Dashboard initialized with default sprint data.", time: new Date().toISOString()}];
    }
  } catch(e) {
    sprints = deepClone(DEFAULT_SPRINTS);
    activityLog = [];
  }
}

function saveState() {
  const toSave = { sprints: sprints.map(s => {
    const {guide, ...rest} = s; return rest;
  }), activityLog };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
}

function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

function resetState() {
  if(!confirm("Reset all progress to defaults? This cannot be undone.")) return;
  localStorage.removeItem(STORAGE_KEY);
  sprints = deepClone(DEFAULT_SPRINTS);
  activityLog = [{text:"Dashboard reset to defaults.", time: new Date().toISOString()}];
  saveState();
  renderBoard();
  updateOverallProgress();
  renderStats();
  renderActivityLog();
  if(currentModalId) openModal(currentModalId);
}

function exportState() {
  const blob = new Blob([JSON.stringify({sprints, activityLog}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kanban-state-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  addActivity("State exported as JSON.");
}

/* ── RENDER ── */
function renderBoard() {
  COLUMN_IDS.forEach(col => {
    const body = document.getElementById(`col-${col}`);
    body.innerHTML = '';
    const cards = sprints.filter(s => s.column === col);
    document.getElementById(`count-${col}`).textContent = cards.length;
    if (cards.length === 0) {
      body.innerHTML = `<div class="column-empty">Drop sprints here</div>`;
      return;
    }
    cards.forEach((s, idx) => {
      body.appendChild(createCardEl(s, idx));
    });
  });
}

function createCardEl(s, idx) {
  const done = s.tasks.filter(t => t.done).length;
  const total = s.tasks.length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const resolvedColor = resolveColor(s.color);

  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.id = s.id;
  card.style.setProperty('--card-color', s.color);
  card.style.animationDelay = `${idx * 0.05}s`;

  card.innerHTML = `
    <div class="card-header">
      <span class="card-sprint-badge">${s.sprint}</span>
      <span class="card-title">${s.title}</span>
    </div>
    <div class="card-desc">${s.desc}</div>
    <div class="card-tags">${s.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
    <div class="card-progress">
      <div class="card-progress-info">
        <span class="card-progress-text">${done}/${total} tasks</span>
        <span class="card-progress-pct">${pct}%</span>
      </div>
      <div class="card-progress-bar">
        <div class="card-progress-fill" style="width:${pct}%"></div>
      </div>
    </div>
    <div class="card-footer">
      <span class="card-est">⏱ ${s.est}</span>
      <button class="card-open-btn" data-id="${s.id}">Open ▸</button>
    </div>
  `;

  // Drag events
  card.addEventListener('dragstart', e => {
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', s.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  // Open modal on card click (but not on button)
  card.addEventListener('click', e => {
    if (e.target.closest('.card-open-btn')) { openModal(s.id); return; }
    // also open on general card click
    openModal(s.id);
  });

  return card;
}

function resolveColor(cssVar) {
  const map = {
    'var(--sprint-0)':'#22c55e','var(--sprint-1)':'#4f7cff','var(--sprint-2)':'#8b5cf6',
    'var(--sprint-3)':'#f97316','var(--sprint-4)':'#ef4444','var(--sprint-5)':'#eab308',
    'var(--sprint-6)':'#a855f7','var(--sprint-7)':'#06b6d4','var(--sprint-8)':'#10b981'
  };
  return map[cssVar] || '#4f7cff';
}

/* ── STATS ── */
function renderStats() {
  const bar = document.getElementById('statsBar');
  const counts = {};
  COLUMN_IDS.forEach(c => counts[c] = 0);
  sprints.forEach(s => counts[s.column]++);
  const totalTasks = sprints.reduce((a,s) => a + s.tasks.length, 0);
  const doneTasks = sprints.reduce((a,s) => a + s.tasks.filter(t=>t.done).length, 0);
  const colColors = {backlog:'var(--col-backlog)', active:'var(--col-active)', docs:'var(--col-docs)', complete:'var(--col-complete)'};

  let html = '';
  COLUMN_IDS.forEach(c => {
    html += `<div class="stat-chip">
      <span class="stat-dot" style="background:${colColors[c]}"></span>
      ${COLUMN_NAMES[c]}: <span class="stat-value">${counts[c]}</span>
    </div>`;
  });
  html += `<div class="stat-chip">🔧 Tasks: <span class="stat-value">${doneTasks}/${totalTasks}</span></div>`;
  html += `<div class="stat-chip">📊 Sprints: <span class="stat-value">${sprints.length}</span></div>`;
  bar.innerHTML = html;
}

/* ── PROGRESS ── */
function updateOverallProgress() {
  const totalTasks = sprints.reduce((a,s) => a + s.tasks.length, 0);
  const doneTasks = sprints.reduce((a,s) => a + s.tasks.filter(t=>t.done).length, 0);
  const pct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
  document.getElementById('overallPct').textContent = pct + '%';
  document.getElementById('overallFill').style.width = pct + '%';
}

/* ── DRAG & DROP ── */
function setupDragDrop() {
  const cols = document.querySelectorAll('.column-body');
  cols.forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.closest('.column').classList.add('drag-over');

      // Insert position indicator
      const afterEl = getDragAfterElement(col, e.clientY);
      const dragging = document.querySelector('.card.dragging');
      if (!dragging) return;
      if (afterEl == null) {
        col.appendChild(dragging);
      } else {
        col.insertBefore(dragging, afterEl);
      }
    });
    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) {
        col.closest('.column').classList.remove('drag-over');
      }
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.closest('.column').classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const colId = col.id.replace('col-','');
      const sprint = sprints.find(s => s.id === id);
      if (sprint && sprint.column !== colId) {
        const oldCol = COLUMN_NAMES[sprint.column];
        sprint.column = colId;
        addActivity(`Moved "${sprint.sprint}: ${sprint.title}" from ${oldCol} → ${COLUMN_NAMES[colId]}`);
        saveState();
      }
      renderBoard();
      updateOverallProgress();
      renderStats();
    });
  });
}

function getDragAfterElement(container, y) {
  const els = [...container.querySelectorAll('.card:not(.dragging)')];
  return els.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset, element: child };
    }
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

/* ── MODAL ── */
function setupModal() {
  const overlay = document.getElementById('modalOverlay');
  const closeBtn = document.getElementById('modalClose');
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Tab switching
  document.querySelectorAll('.modal-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.modal-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab === 'checklist' ? 'panelChecklist' : 'panelGuide').classList.add('active');
    });
  });
}

function openModal(id) {
  const s = sprints.find(x => x.id === id);
  if (!s) return;
  currentModalId = id;
  const overlay = document.getElementById('modalOverlay');
  const resolvedColor = resolveColor(s.color);

  document.getElementById('modalAccent').style.background = `linear-gradient(90deg, ${s.color}, transparent)`;
  document.getElementById('modalBadge').textContent = s.sprint;
  document.getElementById('modalBadge').style.cssText = `
    background: color-mix(in srgb, ${s.color} 15%, transparent);
    color: ${s.color};
    border: 1px solid color-mix(in srgb, ${s.color} 25%, transparent);
  `;
  document.getElementById('modalTitle').textContent = s.title;
  document.getElementById('modalDesc').textContent = s.desc;

  // Set tab accent color
  document.querySelectorAll('.modal-tab').forEach(t => {
    t.style.setProperty('--cc', s.color);
  });
  document.querySelectorAll('.modal-tab.active::after, .modal-tab').forEach(t => {});
  const style = document.querySelector('#modalDynStyle') || document.createElement('style');
  style.id = 'modalDynStyle';
  style.textContent = `.modal-tab.active::after { background: ${s.color}; }`;
  if (!style.parentNode) document.head.appendChild(style);

  updateModalProgress(s);
  renderChecklist(s);
  renderGuide(s);

  // Reset to checklist tab
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.modal-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.modal-tab[data-tab="checklist"]').classList.add('active');
  document.getElementById('panelChecklist').classList.add('active');

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
  currentModalId = null;
}

function updateModalProgress(s) {
  const done = s.tasks.filter(t => t.done).length;
  const total = s.tasks.length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('modalProgressText').textContent = `${done} / ${total} tasks`;
  document.getElementById('modalProgressPct').textContent = pct + '%';
  document.getElementById('modalProgressPct').style.color = s.color;
  document.getElementById('modalProgressFill').style.width = pct + '%';
  document.getElementById('modalProgressFill').style.background = s.color;
}

function renderChecklist(s) {
  const panel = document.getElementById('panelChecklist');
  panel.innerHTML = '';
  s.tasks.forEach((task, i) => {
    const item = document.createElement('div');
    item.className = `checklist-item${task.done ? ' done' : ''}`;
    item.style.setProperty('--cc', s.color);
    item.innerHTML = `
      <div class="checklist-cb-wrap">
        <input type="checkbox" class="checklist-cb" ${task.done ? 'checked' : ''} data-idx="${i}">
        <div class="checklist-cb-visual">✓</div>
      </div>
      <span class="checklist-label">${task.text}</span>
    `;
    const cb = item.querySelector('.checklist-cb');
    cb.addEventListener('change', () => {
      task.done = cb.checked;
      item.classList.toggle('done', cb.checked);
      const action = cb.checked ? 'Completed' : 'Unchecked';
      addActivity(`${action}: "${task.text}" in ${s.sprint}`);
      saveState();
      updateModalProgress(s);
      updateOverallProgress();
      renderStats();
      renderBoard();
    });
    // click on row toggles
    item.addEventListener('click', e => {
      if (e.target === cb) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });
    panel.appendChild(item);
  });
}

function renderGuide(s) {
  const panel = document.getElementById('panelGuide');
  panel.innerHTML = `<div class="guide-content">${escapeHtml(s.guide || 'No guide data available for this sprint.')}</div>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── ACTIVITY LOG ── */
function setupActivityPanel() {
  const toggle = document.getElementById('activityToggle');
  const panel = document.getElementById('activityPanel');
  toggle.addEventListener('click', () => {
    panel.classList.toggle('active');
    if (panel.classList.contains('active')) {
      unreadActivity = 0;
      updateActivityBadge();
    }
  });
  // Close panel on outside click
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && !toggle.contains(e.target)) {
      panel.classList.remove('active');
    }
  });
}

function addActivity(text) {
  const entry = { text, time: new Date().toISOString() };
  activityLog.unshift(entry);
  if (activityLog.length > 100) activityLog.pop();
  unreadActivity++;
  updateActivityBadge();
  saveState();
  renderActivityLog();
}

function renderActivityLog() {
  const list = document.getElementById('activityList');
  if (activityLog.length === 0) {
    list.innerHTML = `<div class="activity-empty">No activity yet.</div>`;
    return;
  }
  list.innerHTML = activityLog.map(entry => {
    const d = new Date(entry.time);
    const timeStr = d.toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'});
    return `<div class="activity-item">
      <div>${entry.text}</div>
      <div class="activity-item-time">${timeStr}</div>
    </div>`;
  }).join('');
}

function updateActivityBadge() {
  const badge = document.getElementById('activityBadge');
  if (unreadActivity > 0) {
    badge.style.display = 'flex';
    badge.textContent = unreadActivity > 99 ? '99+' : unreadActivity;
  } else {
    badge.style.display = 'none';
  }
}

function clearActivityLog() {
  activityLog = [];
  unreadActivity = 0;
  updateActivityBadge();
  saveState();
  renderActivityLog();
}

/* ── BOOT ── */
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
